name: Verify PowerShell script

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/verify-script.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/verify-script.yml'

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$null,
                  [ref]$errors
              ) | Out-Null
              if ($errors) {
                  Write-Host "Parse FAIL: $($_.FullName)" -ForegroundColor Red
                  $errors | ForEach-Object { Write-Host "  $($_.Message)" }
                  $failed = $true
              } else {
                  Write-Host "Parse OK:   $($_.Name)" -ForegroundColor Green
              }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse `
                       -Settings scripts/PSScriptAnalyzerSettings.psd1
          if ($results) {
              $results | Format-Table -AutoSize
              exit 1
          }
          Write-Host "PSScriptAnalyzer OK" -ForegroundColor Green
